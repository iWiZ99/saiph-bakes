<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1a120e"/>
      <stop offset="65%" stop-color="#0a0705"/>
      <stop offset="100%" stop-color="#050302"/>
    </radialGradient>
    <radialGradient id="plate" cx="45%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#f0ece6"/>
      <stop offset="70%" stop-color="#cec7bb"/>
      <stop offset="100%" stop-color="#948d7d"/>
    </radialGradient>
    <radialGradient id="slate" cx="45%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#363d47"/>
      <stop offset="70%" stop-color="#242931"/>
      <stop offset="100%" stop-color="#14181d"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="glow-filter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    
    <radialGradient id="hdBun" cx="45%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#f5ba6e"/>
      <stop offset="60%" stop-color="#c9771a"/>
      <stop offset="100%" stop-color="#7a3f05"/>
    </radialGradient>
    <radialGradient id="hdSausage" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="70%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
  
  </defs>

  <!-- Luxury Dark Backdrop -->
  <rect width="800" height="800" fill="url(#bg)"/>
  
  <!-- Ambient Culinary Spotlight -->
  <circle cx="400" cy="380" r="300" fill="#ef4444" opacity="0.09" filter="url(#glow-filter)"/>

  
    <!-- Slate Platter -->
    <ellipse cx="400" cy="510" rx="300" ry="165" fill="url(#slate)" filter="url(#shadow)"/>

    <!-- Slanted Brioche Hot Dog Bun -->
    <g transform="translate(400, 430) rotate(-10) translate(-400, -430)">
      <!-- Bottom/Back Bun -->
      <rect x="200" y="380" width="400" height="100" rx="50" fill="url(#hdBun)" filter="url(#shadow)"/>
      
      <!-- Grilled Veg / Paneer Sausage -->
      <rect x="180" y="395" width="440" height="60" rx="30" fill="url(#hdSausage)" stroke="#b45309" stroke-width="3"/>
      <!-- Grill Marks -->
      <line x1="280" y1="400" x2="295" y2="450" stroke="#451a03" stroke-width="5" stroke-linecap="round"/>
      <line x1="360" y1="400" x2="375" y2="450" stroke="#451a03" stroke-width="5" stroke-linecap="round"/>
      <line x1="440" y1="400" x2="455" y2="450" stroke="#451a03" stroke-width="5" stroke-linecap="round"/>
      <line x1="520" y1="400" x2="535" y2="450" stroke="#451a03" stroke-width="5" stroke-linecap="round"/>

      <!-- Fiery Zig-Zag Peri-Peri Mayo Drizzle -->
      <path d="M 220 425 Q 260 395 280 435 Q 320 395 340 435 Q 380 395 400 435 Q 440 395 460 435 Q 500 395 520 435 Q 560 395 580 425" stroke="#ef4444" stroke-width="8" stroke-linecap="round" fill="none"/>
      <path d="M 220 425 Q 260 395 280 435 Q 320 395 340 435 Q 380 395 400 435 Q 440 395 460 435 Q 500 395 520 435 Q 560 395 580 425" stroke="#fef08a" stroke-width="3" stroke-linecap="round" fill="none"/>

      <!-- Front Bun Rim -->
      <path d="M 200 440 Q 400 490 600 440" stroke="url(#hdBun)" stroke-width="30" stroke-linecap="round" fill="none"/>
    </g>
  
</svg>