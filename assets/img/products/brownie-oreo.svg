<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1a120e"/>
      <stop offset="65%" stop-color="#0a0705"/>
      <stop offset="100%" stop-color="#050302"/>
    </radialGradient>
    <radialGradient id="plate" cx="45%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#f0ece6"/>
      <stop offset="70%" stop-color="#cec7bb"/>
      <stop offset="100%" stop-color="#948d7d"/>
    </radialGradient>
    <radialGradient id="slate" cx="45%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#363d47"/>
      <stop offset="70%" stop-color="#242931"/>
      <stop offset="100%" stop-color="#14181d"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="glow-filter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    
    <radialGradient id="brCrustTop" cx="45%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#4a2818"/>
      <stop offset="70%" stop-color="#2c1409"/>
      <stop offset="100%" stop-color="#140803"/>
    </radialGradient>
    <linearGradient id="brFudgeSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c1409"/>
      <stop offset="100%" stop-color="#0f0502"/>
    </linearGradient>
  
  </defs>

  <!-- Luxury Dark Backdrop -->
  <rect width="800" height="800" fill="url(#bg)"/>
  
  <!-- Ambient Culinary Spotlight -->
  <circle cx="400" cy="380" r="300" fill="#6b3a22" opacity="0.09" filter="url(#glow-filter)"/>

  
    <!-- Slate Platter -->
    <ellipse cx="400" cy="510" rx="290" ry="160" fill="url(#slate)" filter="url(#shadow)"/>

    <!-- Stack of Two Fudgy Square Brownie Blocks -->
    <!-- Brownie 1 (Bottom) -->
    <path d="M 260 460 L 440 500 L 520 440 L 340 400 Z" fill="url(#brCrustTop)" filter="url(#shadow)"/>
    <path d="M 260 460 L 440 500 L 440 530 L 260 490 Z" fill="url(#brFudgeSide)"/>

    <!-- Brownie 2 (Top Stack) -->
    <g transform="translate(30, -50)">
      <!-- Fudgy Sides -->
      <path d="M 260 440 L 440 480 L 440 520 L 260 480 Z" fill="url(#brFudgeSide)" filter="url(#shadow)"/>
      <path d="M 440 480 L 520 420 L 520 460 L 440 520 Z" fill="#140803"/>
      <!-- Papery Crinkled Glossy Top -->
      <path d="M 260 440 L 440 480 L 520 420 L 340 380 Z" fill="url(#brCrustTop)"/>
      <!-- Crackled Fissures on Papery Skin -->
      <path d="M 310 420 Q 360 440 420 430" stroke="#6b3a22" stroke-width="2.5" fill="none"/>
      <path d="M 380 410 Q 410 440 460 420" stroke="#6b3a22" stroke-width="2.5" fill="none"/>
      <path d="M 340 450 Q 380 460 430 450" stroke="#6b3a22" stroke-width="2" fill="none"/>
      <!-- Glossy Reflection -->
      <ellipse cx="380" cy="430" rx="60" ry="25" fill="#fff" opacity="0.14" filter="blur(6px)"/>
      
    <!-- Crushed Oreo Chunks Baked into Top -->
    <ellipse cx="380" cy="420" rx="22" ry="14" fill="#171717" stroke="#404040" stroke-width="2"/>
    <path d="M 370 420 L 390 420" stroke="#fff" stroke-width="3"/>
    <ellipse cx="440" cy="430" rx="18" ry="12" fill="#171717" stroke="#404040" stroke-width="2"/>
  
    </g>
  
</svg>