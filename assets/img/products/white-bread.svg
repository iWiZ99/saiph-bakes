<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1a120e"/>
      <stop offset="65%" stop-color="#0a0705"/>
      <stop offset="100%" stop-color="#050302"/>
    </radialGradient>
    <radialGradient id="plate" cx="45%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#f0ece6"/>
      <stop offset="70%" stop-color="#cec7bb"/>
      <stop offset="100%" stop-color="#948d7d"/>
    </radialGradient>
    <radialGradient id="slate" cx="45%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#363d47"/>
      <stop offset="70%" stop-color="#242931"/>
      <stop offset="100%" stop-color="#14181d"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="glow-filter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    
    <radialGradient id="brCrust" cx="45%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <radialGradient id="brCrumb" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fafaf9"/>
    </radialGradient>
  
  </defs>

  <!-- Luxury Dark Backdrop -->
  <rect width="800" height="800" fill="url(#bg)"/>
  
  <!-- Ambient Culinary Spotlight -->
  <circle cx="400" cy="380" r="300" fill="#f59e0b" opacity="0.09" filter="url(#glow-filter)"/>

  
    <!-- Rustic Wood/Slate Board -->
    <ellipse cx="400" cy="510" rx="300" ry="165" fill="url(#slate)" filter="url(#shadow)"/>

    <!-- Artisan Loaf Body -->
    <path d="M 220 440 C 220 310 580 310 580 440 C 580 490 220 490 220 440 Z" fill="url(#brCrust)" filter="url(#shadow)"/>

    <!-- Cut Slice Standing Adjacent -->
    <g transform="translate(-50, 20)">
      <ellipse cx="270" cy="485" rx="50" ry="20" fill="#000" opacity="0.3" filter="blur(6px)"/>
      <path d="M 230 460 C 230 380 310 380 310 460 C 310 495 230 495 230 460 Z" fill="url(#brCrumb)" stroke="#b45309" stroke-width="7"/>
    </g>

    
    <path d="M 320 380 Q 350 360 380 380" stroke="#fed7aa" stroke-width="5" fill="none"/>
    <path d="M 420 380 Q 450 360 480 380" stroke="#fed7aa" stroke-width="5" fill="none"/>
  
    

    <!-- Flour Dusting on Crust -->
    <ellipse cx="400" cy="360" rx="130" ry="40" fill="#fff" opacity="0.16" filter="blur(12px)"/>
  
</svg>