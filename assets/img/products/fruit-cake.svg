<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1a120e"/>
      <stop offset="65%" stop-color="#0a0705"/>
      <stop offset="100%" stop-color="#050302"/>
    </radialGradient>
    <radialGradient id="plate" cx="45%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#f0ece6"/>
      <stop offset="70%" stop-color="#cec7bb"/>
      <stop offset="100%" stop-color="#948d7d"/>
    </radialGradient>
    <radialGradient id="slate" cx="45%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#363d47"/>
      <stop offset="70%" stop-color="#242931"/>
      <stop offset="100%" stop-color="#14181d"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="glow-filter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    
  <radialGradient id="fcBase" cx="45%" cy="35%" r="60%">
    <stop offset="0%" stop-color="#99582a"/>
    <stop offset="70%" stop-color="#6f3b14"/>
    <stop offset="100%" stop-color="#432007"/>
  </radialGradient>

  </defs>

  <!-- Luxury Dark Backdrop -->
  <rect width="800" height="800" fill="url(#bg)"/>
  
  <!-- Ambient Culinary Spotlight -->
  <circle cx="400" cy="380" r="300" fill="#d4af37" opacity="0.09" filter="url(#glow-filter)"/>

  
  <ellipse cx="400" cy="490" rx="290" ry="160" fill="url(#plate)" filter="url(#shadow)"/>
  <ellipse cx="400" cy="450" rx="200" ry="100" fill="url(#fcBase)"/>
  <ellipse cx="400" cy="420" rx="190" ry="85" fill="#7a4117"/>
  <!-- Glazed Cherries & Candied Peel -->
  <circle cx="340" cy="420" r="14" fill="#c9182b"/>
  <circle cx="337" cy="416" r="4" fill="#ff7a87"/>
  <circle cx="420" cy="405" r="15" fill="#2d6a4f"/>
  <circle cx="417" cy="402" r="4" fill="#74c69d"/>
  <circle cx="460" cy="430" r="13" fill="#c9182b"/>
  <circle cx="390" cy="445" r="14" fill="#e07a5f"/>
  <circle cx="430" cy="440" r="12" fill="#d4a373"/>
  <circle cx="370" cy="400" r="11" fill="#c9182b"/>
  <path d="M 330 440 Q 360 435 375 450" stroke="#f4a261" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M 430 415 Q 450 425 460 410" stroke="#e76f51" stroke-width="5" stroke-linecap="round" fill="none"/>
  <ellipse cx="400" cy="415" rx="170" ry="70" fill="#fff" opacity="0.1" filter="blur(8px)"/>

</svg>