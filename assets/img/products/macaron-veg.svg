<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1a120e"/>
      <stop offset="65%" stop-color="#0a0705"/>
      <stop offset="100%" stop-color="#050302"/>
    </radialGradient>
    <radialGradient id="plate" cx="45%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#f0ece6"/>
      <stop offset="70%" stop-color="#cec7bb"/>
      <stop offset="100%" stop-color="#948d7d"/>
    </radialGradient>
    <radialGradient id="slate" cx="45%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#363d47"/>
      <stop offset="70%" stop-color="#242931"/>
      <stop offset="100%" stop-color="#14181d"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="glow-filter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    
    <radialGradient id="mac1" cx="45%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="70%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#9d174d"/>
    </radialGradient>
    <radialGradient id="mac2" cx="45%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="70%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </radialGradient>
  
  </defs>

  <!-- Luxury Dark Backdrop -->
  <rect width="800" height="800" fill="url(#bg)"/>
  
  <!-- Ambient Culinary Spotlight -->
  <circle cx="400" cy="380" r="300" fill="#f472b6" opacity="0.09" filter="url(#glow-filter)"/>

  
    <!-- Ceramic Tasting Platter -->
    <ellipse cx="400" cy="510" rx="290" ry="160" fill="url(#plate)" filter="url(#shadow)"/>

    <!-- Macaron 1 (Foreground Left) -->
    <g transform="translate(320, 430)">
      <!-- Top Shell -->
      <ellipse cx="0" cy="-25" rx="75" ry="38" fill="url(#mac1)" filter="url(#shadow)"/>
      <!-- Pied / Ruffled Foot -->
      <ellipse cx="0" cy="-8" rx="77" ry="10" fill="#db2777" stroke="#9d174d" stroke-dasharray="6 3"/>
      <!-- Ganache Filling -->
      <ellipse cx="0" cy="0" rx="72" ry="12" fill="#fff" opacity="0.9"/>
      <!-- Bottom Pied -->
      <ellipse cx="0" cy="8" rx="77" ry="10" fill="#db2777" stroke="#9d174d" stroke-dasharray="6 3"/>
      <!-- Bottom Shell -->
      <ellipse cx="0" cy="20" rx="74" ry="32" fill="url(#mac1)"/>
      <ellipse cx="-15" cy="-35" rx="35" ry="14" fill="#fff" opacity="0.28" filter="blur(6px)"/>
    </g>

    <!-- Macaron 2 (Foreground Right) -->
    <g transform="translate(470, 420)">
      <ellipse cx="0" cy="-25" rx="75" ry="38" fill="url(#mac2)" filter="url(#shadow)"/>
      <ellipse cx="0" cy="-8" rx="77" ry="10" fill="#10b981" stroke="#047857" stroke-dasharray="6 3"/>
      <ellipse cx="0" cy="0" rx="72" ry="12" fill="#3b1e08"/>
      <ellipse cx="0" cy="8" rx="77" ry="10" fill="#10b981" stroke="#047857" stroke-dasharray="6 3"/>
      <ellipse cx="0" cy="20" rx="74" ry="32" fill="url(#mac2)"/>
      <ellipse cx="-15" cy="-35" rx="35" ry="14" fill="#fff" opacity="0.28" filter="blur(6px)"/>
    </g>
  
</svg>