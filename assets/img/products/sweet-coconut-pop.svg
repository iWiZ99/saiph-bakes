<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1a120e"/>
      <stop offset="65%" stop-color="#0a0705"/>
      <stop offset="100%" stop-color="#050302"/>
    </radialGradient>
    <radialGradient id="plate" cx="45%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#f0ece6"/>
      <stop offset="70%" stop-color="#cec7bb"/>
      <stop offset="100%" stop-color="#948d7d"/>
    </radialGradient>
    <radialGradient id="slate" cx="45%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#363d47"/>
      <stop offset="70%" stop-color="#242931"/>
      <stop offset="100%" stop-color="#14181d"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="glow-filter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    
  <radialGradient id="coconutBite" cx="45%" cy="35%" r="60%">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="60%" stop-color="#fef08a"/>
    <stop offset="100%" stop-color="#b45309"/>
  </radialGradient>

  </defs>

  <!-- Luxury Dark Backdrop -->
  <rect width="800" height="800" fill="url(#bg)"/>
  
  <!-- Ambient Culinary Spotlight -->
  <circle cx="400" cy="380" r="300" fill="#d4af37" opacity="0.09" filter="url(#glow-filter)"/>

  
  <ellipse cx="400" cy="510" rx="280" ry="150" fill="url(#plate)" filter="url(#shadow)"/>
  <!-- Group of 3 Golden Caramelized Coconut Pops -->
  <circle cx="340" cy="440" r="65" fill="url(#coconutBite)" filter="url(#shadow)"/>
  <circle cx="460" cy="450" r="60" fill="url(#coconutBite)" filter="url(#shadow)"/>
  <circle cx="400" cy="380" r="75" fill="url(#coconutBite)" filter="url(#shadow)"/>
  <!-- Shredded Coconut Flakes -->
  <path d="M 370 350 L 385 360" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <path d="M 420 345 L 435 355" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <path d="M 390 380 L 415 385" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 320 420 L 345 425" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <path d="M 445 435 L 470 440" stroke="#fff" stroke-width="3" stroke-linecap="round"/>

</svg>