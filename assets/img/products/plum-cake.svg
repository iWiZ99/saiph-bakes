<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1a120e"/>
      <stop offset="65%" stop-color="#0a0705"/>
      <stop offset="100%" stop-color="#050302"/>
    </radialGradient>
    <radialGradient id="plate" cx="45%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#f0ece6"/>
      <stop offset="70%" stop-color="#cec7bb"/>
      <stop offset="100%" stop-color="#948d7d"/>
    </radialGradient>
    <radialGradient id="slate" cx="45%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#363d47"/>
      <stop offset="70%" stop-color="#242931"/>
      <stop offset="100%" stop-color="#14181d"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="glow-filter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    
  <radialGradient id="plumBase" cx="45%" cy="35%" r="60%">
    <stop offset="0%" stop-color="#4a2810"/>
    <stop offset="70%" stop-color="#2d1505"/>
    <stop offset="100%" stop-color="#190a01"/>
  </radialGradient>

  </defs>

  <!-- Luxury Dark Backdrop -->
  <rect width="800" height="800" fill="url(#bg)"/>
  
  <!-- Ambient Culinary Spotlight -->
  <circle cx="400" cy="380" r="300" fill="#d4af37" opacity="0.09" filter="url(#glow-filter)"/>

  
  <ellipse cx="400" cy="490" rx="290" ry="160" fill="url(#plate)" filter="url(#shadow)"/>
  <!-- Dark Rich Loaf / Bundt -->
  <ellipse cx="400" cy="450" rx="210" ry="105" fill="url(#plumBase)"/>
  <ellipse cx="400" cy="415" rx="195" ry="90" fill="#3b1d0a"/>
  <!-- Dried Fruits & Nuts -->
  <ellipse cx="330" cy="405" rx="12" ry="7" fill="#b07d62" transform="rotate(-20 330 405)"/>
  <ellipse cx="450" cy="420" rx="14" ry="8" fill="#deb887" transform="rotate(30 450 420)"/>
  <circle cx="380" cy="425" r="9" fill="#1b120c"/>
  <circle cx="410" cy="395" r="8" fill="#1b120c"/>
  <circle cx="440" cy="390" r="11" fill="#720026"/>
  <circle cx="360" cy="435" r="10" fill="#720026"/>
  <!-- Snowy Icing Dusting -->
  <ellipse cx="400" cy="410" rx="180" ry="80" fill="#ffffff" opacity="0.22" filter="blur(10px)"/>
  <circle cx="350" cy="410" r="1.5" fill="#fff"/>
  <circle cx="420" cy="420" r="1.8" fill="#fff"/>
  <circle cx="390" cy="400" r="1.5" fill="#fff"/>

</svg>