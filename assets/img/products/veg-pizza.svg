<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1a120e"/>
      <stop offset="65%" stop-color="#0a0705"/>
      <stop offset="100%" stop-color="#050302"/>
    </radialGradient>
    <radialGradient id="plate" cx="45%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#f0ece6"/>
      <stop offset="70%" stop-color="#cec7bb"/>
      <stop offset="100%" stop-color="#948d7d"/>
    </radialGradient>
    <radialGradient id="slate" cx="45%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#363d47"/>
      <stop offset="70%" stop-color="#242931"/>
      <stop offset="100%" stop-color="#14181d"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="glow-filter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    
    <radialGradient id="pizzaCrust" cx="45%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#f8c878"/>
      <stop offset="70%" stop-color="#c9822a"/>
      <stop offset="100%" stop-color="#7a4209"/>
    </radialGradient>
    <radialGradient id="cheeseMelt" cx="48%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="80%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
  
  </defs>

  <!-- Luxury Dark Backdrop -->
  <rect width="800" height="800" fill="url(#bg)"/>
  
  <!-- Ambient Culinary Spotlight -->
  <circle cx="400" cy="380" r="300" fill="#f59e0b" opacity="0.09" filter="url(#glow-filter)"/>

  
    <!-- Black Slate Pizza Board with Handle -->
    <ellipse cx="400" cy="485" rx="320" ry="190" fill="url(#slate)" filter="url(#shadow)"/>
    
    <!-- Leopard-Spotted Crust -->
    <ellipse cx="400" cy="455" rx="270" ry="155" fill="url(#pizzaCrust)"/>
    <!-- Blistered Char Spots -->
    <ellipse cx="180" cy="430" rx="9" ry="5" fill="#2d1704"/>
    <ellipse cx="230" cy="350" rx="12" ry="7" fill="#2d1704"/>
    <ellipse cx="360" cy="315" rx="14" ry="6" fill="#2d1704"/>
    <ellipse cx="500" cy="330" rx="11" ry="6" fill="#2d1704"/>
    <ellipse cx="610" cy="410" rx="12" ry="7" fill="#2d1704"/>
    <ellipse cx="580" cy="510" rx="10" ry="5" fill="#2d1704"/>
    <ellipse cx="250" cy="540" rx="12" ry="6" fill="#2d1704"/>

    <!-- Molten Cheese & Sauce Lake -->
    <ellipse cx="400" cy="455" rx="225" ry="125" fill="url(#cheeseMelt)"/>
    <!-- Rich Tomato Passata swirls peeking through -->
    <path d="M 280 430 Q 340 410 390 440" stroke="#dc2626" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 420 460 Q 470 480 520 450" stroke="#dc2626" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.6"/>

    
    <!-- Sliced Black Olives -->
    <circle cx="310" cy="420" r="14" fill="#18181b" stroke="#3f3f46" stroke-width="3"/>
    <circle cx="310" cy="420" r="6" fill="#f59e0b"/>
    <circle cx="480" cy="430" r="14" fill="#18181b" stroke="#3f3f46" stroke-width="3"/>
    <circle cx="480" cy="430" r="6" fill="#f59e0b"/>
    <circle cx="390" cy="480" r="13" fill="#18181b" stroke="#3f3f46" stroke-width="3"/>
    <circle cx="390" cy="480" r="5.5" fill="#f59e0b"/>
    <!-- Golden Sweet Corn Kernels -->
    <ellipse cx="360" cy="410" rx="7" ry="5" fill="#facc15"/>
    <ellipse cx="375" cy="415" rx="7" ry="5" fill="#facc15"/>
    <ellipse cx="440" cy="460" rx="7" ry="5" fill="#facc15"/>
    <ellipse cx="455" cy="455" rx="7" ry="5" fill="#facc15"/>
    <!-- Sliced Mushrooms -->
    <path d="M 340 450 C 340 435 370 435 370 450 Z" fill="#d6d3d1"/>
    <rect x="350" y="450" width="10" height="12" fill="#a8a29e"/>
    <path d="M 430 400 C 430 385 460 385 460 400 Z" fill="#d6d3d1"/>
    <rect x="440" y="400" width="10" height="12" fill="#a8a29e"/>
  

    <!-- Oregano / Herb Dusting -->
    <circle cx="340" cy="430" r="1.5" fill="#14532d"/>
    <circle cx="430" cy="420" r="1.8" fill="#14532d"/>
    <circle cx="470" cy="450" r="1.5" fill="#14532d"/>
    <circle cx="370" cy="470" r="1.8" fill="#14532d"/>
    <circle cx="410" cy="490" r="1.5" fill="#14532d"/>
    <!-- Olive Oil Glisten -->
    <ellipse cx="380" cy="430" rx="140" ry="60" fill="#fff" opacity="0.14" filter="blur(14px)"/>
  
</svg>