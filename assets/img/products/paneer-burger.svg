<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1a120e"/>
      <stop offset="65%" stop-color="#0a0705"/>
      <stop offset="100%" stop-color="#050302"/>
    </radialGradient>
    <radialGradient id="plate" cx="45%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#f0ece6"/>
      <stop offset="70%" stop-color="#cec7bb"/>
      <stop offset="100%" stop-color="#948d7d"/>
    </radialGradient>
    <radialGradient id="slate" cx="45%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#363d47"/>
      <stop offset="70%" stop-color="#242931"/>
      <stop offset="100%" stop-color="#14181d"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="glow-filter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    
    <radialGradient id="topBun" cx="45%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#f5ba6e"/>
      <stop offset="60%" stop-color="#cf7f23"/>
      <stop offset="100%" stop-color="#874706"/>
    </radialGradient>
    <radialGradient id="bottomBun" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#e8a853"/>
      <stop offset="100%" stop-color="#94530e"/>
    </radialGradient>
    <radialGradient id="pattyGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="70%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
  
  </defs>

  <!-- Luxury Dark Backdrop -->
  <rect width="800" height="800" fill="url(#bg)"/>
  
  <!-- Ambient Culinary Spotlight -->
  <circle cx="400" cy="380" r="300" fill="#f59e0b" opacity="0.09" filter="url(#glow-filter)"/>

  
    <!-- Slate Platter -->
    <ellipse cx="400" cy="530" rx="310" ry="165" fill="url(#slate)" filter="url(#shadow)"/>
    <ellipse cx="400" cy="525" rx="280" ry="145" fill="none" stroke="#475569" stroke-width="2" opacity="0.4"/>

    <!-- Bottom Bun -->
    <path d="M 250 480 Q 400 520 550 480 L 535 520 Q 400 560 265 520 Z" fill="url(#bottomBun)"/>

    
    <!-- Crisp Ruffled Lettuce -->
    <path d="M 230 435 Q 260 455 290 435 Q 320 460 360 435 Q 400 460 440 435 Q 480 460 520 435 Q 550 455 570 435 L 560 425 Q 400 440 240 425 Z" fill="#22c55e"/>
    <path d="M 250 430 Q 300 445 350 430" stroke="#86efac" stroke-width="3" fill="none"/>
    <path d="M 420 430 Q 470 445 520 430" stroke="#86efac" stroke-width="3" fill="none"/>
    <!-- Tomato Slice -->
    <path d="M 260 425 Q 400 445 540 425 L 535 410 Q 400 430 265 410 Z" fill="#ef4444"/>
  
    

    <!-- Savoury Patty -->
    <ellipse cx="400" cy="460" rx="160" ry="40" fill="url(#pattyGrad)"/>

    
    <!-- Melted Cheddar Corners Draping Down -->
    <path d="M 250 445 L 310 495 L 340 448 L 410 505 L 450 448 L 520 490 L 550 445 Z" fill="#f59e0b" filter="url(#shadow)"/>
    <path d="M 270 445 L 315 485 L 335 448" fill="#fbbf24"/>
    <path d="M 380 448 L 415 495 L 440 448" fill="#fbbf24"/>
  

    <!-- Glossy Brioche Top Bun -->
    <path d="M 230 390 C 230 240 570 240 570 390 C 570 420 230 420 230 390 Z" fill="url(#topBun)" filter="url(#shadow)"/>
    <ellipse cx="400" cy="310" rx="140" ry="50" fill="#fff" opacity="0.16" filter="blur(16px)"/>

    <!-- Toasted Sesame Seeds -->
    <ellipse cx="360" cy="300" rx="5" ry="3" fill="#fef3c7" transform="rotate(25 360 300)"/>
    <ellipse cx="420" cy="285" rx="5.5" ry="3" fill="#fef3c7" transform="rotate(-15 420 285)"/>
    <ellipse cx="460" cy="315" rx="5" ry="3.2" fill="#fef3c7" transform="rotate(40 460 315)"/>
    <ellipse cx="330" cy="335" rx="5" ry="3" fill="#fef3c7" transform="rotate(-30 330 335)"/>
    <ellipse cx="390" cy="330" rx="5.5" ry="3.2" fill="#fef3c7" transform="rotate(10 390 330)"/>
    <ellipse cx="440" cy="345" rx="4.8" ry="3" fill="#fef3c7" transform="rotate(-20 440 345)"/>
    <ellipse cx="485" cy="340" rx="5" ry="3" fill="#fef3c7" transform="rotate(35 485 340)"/>
  
</svg>