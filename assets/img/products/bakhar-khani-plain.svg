<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1a120e"/>
      <stop offset="65%" stop-color="#0a0705"/>
      <stop offset="100%" stop-color="#050302"/>
    </radialGradient>
    <radialGradient id="plate" cx="45%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#f0ece6"/>
      <stop offset="70%" stop-color="#cec7bb"/>
      <stop offset="100%" stop-color="#948d7d"/>
    </radialGradient>
    <radialGradient id="slate" cx="45%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#363d47"/>
      <stop offset="70%" stop-color="#242931"/>
      <stop offset="100%" stop-color="#14181d"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="glow-filter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    
    <radialGradient id="bkCrust" cx="45%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#f8dfa2"/>
      <stop offset="60%" stop-color="#d49c40"/>
      <stop offset="100%" stop-color="#82510a"/>
    </radialGradient>
  
  </defs>

  <!-- Luxury Dark Backdrop -->
  <rect width="800" height="800" fill="url(#bg)"/>
  
  <!-- Ambient Culinary Spotlight -->
  <circle cx="400" cy="380" r="300" fill="#d49c40" opacity="0.09" filter="url(#glow-filter)"/>

  
    <ellipse cx="400" cy="500" rx="290" ry="160" fill="url(#plate)" filter="url(#shadow)"/>
    <!-- Stack of 2 Flaky Bakhar Khani Discs -->
    <!-- Bottom Disc -->
    <ellipse cx="360" cy="460" rx="170" ry="95" fill="url(#bkCrust)" opacity="0.9"/>
    
    <!-- Top Disc -->
    <ellipse cx="420" cy="415" rx="180" ry="105" fill="url(#bkCrust)" filter="url(#shadow)"/>
    <!-- Laminated Concentric Spiral Rings -->
    <ellipse cx="420" cy="415" rx="145" ry="80" fill="none" stroke="#ba7c1f" stroke-width="4" stroke-dasharray="16 8"/>
    <ellipse cx="420" cy="415" rx="110" ry="60" fill="none" stroke="#a16612" stroke-width="3.5" stroke-dasharray="12 6"/>
    <ellipse cx="420" cy="415" rx="75" ry="40" fill="none" stroke="#7e4d08" stroke-width="3"/>
    <ellipse cx="420" cy="415" rx="40" ry="20" fill="none" stroke="#633b04" stroke-width="2.5"/>

    
    <!-- White Poppy & Sesame Seeds -->
    <circle cx="380" cy="410" r="2.5" fill="#fff" opacity="0.9"/>
    <circle cx="430" cy="400" r="2.8" fill="#fff" opacity="0.9"/>
    <circle cx="450" cy="430" r="2.5" fill="#fff" opacity="0.9"/>
    <circle cx="410" cy="435" r="2.5" fill="#fff" opacity="0.9"/>
    <circle cx="460" cy="390" r="2.8" fill="#fff" opacity="0.9"/>
    <circle cx="360" cy="425" r="2.5" fill="#fff" opacity="0.9"/>
  

    <!-- Butter Sheen Highlight -->
    <ellipse cx="400" cy="390" rx="120" ry="50" fill="#fff" opacity="0.18" filter="blur(14px)"/>
  
</svg>