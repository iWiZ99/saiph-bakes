<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1a120e"/>
      <stop offset="65%" stop-color="#0a0705"/>
      <stop offset="100%" stop-color="#050302"/>
    </radialGradient>
    <radialGradient id="plate" cx="45%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#f0ece6"/>
      <stop offset="70%" stop-color="#cec7bb"/>
      <stop offset="100%" stop-color="#948d7d"/>
    </radialGradient>
    <radialGradient id="slate" cx="45%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#363d47"/>
      <stop offset="70%" stop-color="#242931"/>
      <stop offset="100%" stop-color="#14181d"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="glow-filter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    
    <linearGradient id="spGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="crGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef2f2"/>
    </linearGradient>
    <radialGradient id="glGrad" cx="45%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="70%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
  
  </defs>

  <!-- Luxury Dark Backdrop -->
  <rect width="800" height="800" fill="url(#bg)"/>
  
  <!-- Ambient Culinary Spotlight -->
  <circle cx="400" cy="380" r="300" fill="#b91c1c" opacity="0.09" filter="url(#glow-filter)"/>

  
    <!-- Porcelain Platter -->
    <ellipse cx="400" cy="510" rx="290" ry="160" fill="url(#plate)" filter="url(#shadow)"/>

    <!-- Pastry Slice Isometric Block -->
    <!-- Base Layer Sponge -->
    <path d="M 240 450 L 480 500 L 560 430 L 320 380 Z" fill="url(#spGrad)" filter="url(#shadow)"/>
    <!-- Cream Layer 1 -->
    <path d="M 240 430 L 480 480 L 560 410 L 320 360 Z" fill="url(#crGrad)"/>
    <!-- Middle Sponge -->
    <path d="M 240 410 L 480 460 L 560 390 L 320 340 Z" fill="url(#spGrad)"/>
    <!-- Cream Layer 2 -->
    <path d="M 240 390 L 480 440 L 560 370 L 320 320 Z" fill="url(#crGrad)"/>
    <!-- Top Sponge -->
    <path d="M 240 370 L 480 420 L 560 350 L 320 300 Z" fill="url(#spGrad)"/>
    <!-- Top Mirror Glaze -->
    <path d="M 240 350 L 480 400 L 560 330 L 320 280 Z" fill="url(#glGrad)"/>
    
    <!-- Mirror Glaze Sheen -->
    <path d="M 270 340 L 450 380 L 480 350 L 310 310 Z" fill="#fff" opacity="0.22" filter="blur(6px)"/>

    
    <!-- Tangy Cream Cheese Rosette & Red Velvet Crumb Dust -->
    <circle cx="400" cy="320" r="18" fill="#ffffff" filter="url(#shadow)"/>
    <circle cx="370" cy="335" r="3" fill="#dc2626"/>
    <circle cx="425" cy="330" r="2.5" fill="#dc2626"/>
    <circle cx="400" cy="345" r="2.8" fill="#dc2626"/>
  
  
</svg>