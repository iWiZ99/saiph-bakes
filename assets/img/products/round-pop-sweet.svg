<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1a120e"/>
      <stop offset="65%" stop-color="#0a0705"/>
      <stop offset="100%" stop-color="#050302"/>
    </radialGradient>
    <radialGradient id="plate" cx="45%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#f0ece6"/>
      <stop offset="70%" stop-color="#cec7bb"/>
      <stop offset="100%" stop-color="#948d7d"/>
    </radialGradient>
    <radialGradient id="slate" cx="45%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#363d47"/>
      <stop offset="70%" stop-color="#242931"/>
      <stop offset="100%" stop-color="#14181d"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="glow-filter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    
  <radialGradient id="rdPop" cx="45%" cy="35%" r="60%">
    <stop offset="0%" stop-color="#fed7aa"/>
    <stop offset="60%" stop-color="#ea580c"/>
    <stop offset="100%" stop-color="#7c2d12"/>
  </radialGradient>

  </defs>

  <!-- Luxury Dark Backdrop -->
  <rect width="800" height="800" fill="url(#bg)"/>
  
  <!-- Ambient Culinary Spotlight -->
  <circle cx="400" cy="380" r="300" fill="#d4af37" opacity="0.09" filter="url(#glow-filter)"/>

  
  <ellipse cx="400" cy="510" rx="280" ry="150" fill="url(#plate)" filter="url(#shadow)"/>
  <circle cx="330" cy="440" r="65" fill="url(#rdPop)" filter="url(#shadow)"/>
  <circle cx="470" cy="445" r="65" fill="url(#rdPop)" filter="url(#shadow)"/>
  <circle cx="400" cy="370" r="80" fill="url(#rdPop)" filter="url(#shadow)"/>
  <!-- Sugar Crystal Dusting -->
  <ellipse cx="400" cy="350" rx="50" ry="25" fill="#fff" opacity="0.3" filter="blur(6px)"/>
  <circle cx="380" cy="360" r="2" fill="#fff"/>
  <circle cx="420" cy="355" r="2" fill="#fff"/>

</svg>