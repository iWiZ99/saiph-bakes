<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1a120e"/>
      <stop offset="65%" stop-color="#0a0705"/>
      <stop offset="100%" stop-color="#050302"/>
    </radialGradient>
    <radialGradient id="plate" cx="45%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#f0ece6"/>
      <stop offset="70%" stop-color="#cec7bb"/>
      <stop offset="100%" stop-color="#948d7d"/>
    </radialGradient>
    <radialGradient id="slate" cx="45%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#363d47"/>
      <stop offset="70%" stop-color="#242931"/>
      <stop offset="100%" stop-color="#14181d"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="glow-filter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    
  <radialGradient id="cheeseCream" cx="45%" cy="35%" r="60%">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="70%" stop-color="#fdfbf7"/>
    <stop offset="100%" stop-color="#ede4d3"/>
  </radialGradient>
  <radialGradient id="grahamCrust" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#d49a5b"/>
    <stop offset="100%" stop-color="#8c5822"/>
  </radialGradient>
  <radialGradient id="berryCompote" cx="45%" cy="30%" r="60%">
    <stop offset="0%" stop-color="#c9184a"/>
    <stop offset="70%" stop-color="#800f2f"/>
    <stop offset="100%" stop-color="#480418"/>
  </radialGradient>

  </defs>

  <!-- Luxury Dark Backdrop -->
  <rect width="800" height="800" fill="url(#bg)"/>
  
  <!-- Ambient Culinary Spotlight -->
  <circle cx="400" cy="380" r="300" fill="#d4af37" opacity="0.09" filter="url(#glow-filter)"/>

  
  <ellipse cx="400" cy="495" rx="300" ry="165" fill="url(#plate)" filter="url(#shadow)"/>
  <!-- Graham Crust Base -->
  <ellipse cx="400" cy="460" rx="225" ry="110" fill="url(#grahamCrust)"/>
  <!-- Velvet Cream Layer -->
  <ellipse cx="400" cy="425" rx="220" ry="100" fill="url(#cheeseCream)"/>
  <!-- Glossy Strawberry/Berry Mirror Glaze Crown -->
  <ellipse cx="400" cy="415" rx="195" ry="85" fill="url(#berryCompote)"/>
  <!-- Glaze Drips -->
  <path d="M 230 430 Q 235 450 240 455 Q 245 440 250 432" fill="#800f2f"/>
  <path d="M 320 445 Q 325 470 330 475 Q 335 455 340 445" fill="#800f2f"/>
  <path d="M 480 445 Q 485 468 490 472 Q 495 455 500 445" fill="#800f2f"/>
  <!-- Fresh Berry Garnishes -->
  <circle cx="370" cy="395" r="16" fill="#a4133c"/>
  <circle cx="400" cy="385" r="18" fill="#800f2f"/>
  <circle cx="430" cy="395" r="15" fill="#c9184a"/>
  <!-- Mint Leaf -->
  <path d="M 405 375 Q 425 355 440 365 Q 430 385 405 375 Z" fill="#2d6a4f"/>
  <ellipse cx="400" cy="405" rx="160" ry="60" fill="#fff" opacity="0.2" filter="blur(12px)"/>

</svg>