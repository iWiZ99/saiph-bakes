<section class="page-head">
  <div class="shell">
    <nav aria-label="Breadcrumb">
      <ol class="crumbs">
        <li><a href="index.html">Home</a></li>
        <li aria-current="page">Wishlist</li>
      </ol>
    </nav>
    <div class="page-head__inner">
      <span class="eyebrow">Saved For Later</span>
      <h1>Your Wishlist</h1>
      <p class="lede" data-wish-lede>Everything you have saved, ready to move into the cart when the moment arrives.</p>
    </div>
  </div>
</section>

<section class="section section--tight">
  <div class="shell">
    <div class="shop-toolbar" data-wish-toolbar hidden>
      <p class="shop-toolbar__count"><b data-wish-total>0</b> saved</p>
      <span class="spacer"></span>
      <button class="btn btn--sm btn--outline" type="button" data-add-all>Add all to cart</button>
      <button class="link" type="button" data-clear-wish style="font-size:.6rem;color:var(--text-faint)">Clear wishlist</button>
    </div>
    <div class="product-grid" data-wish-grid></div>
  </div>
</section>

<section class="section section--tinted">
  <div class="shell">
    <div class="section-head section-head--split">
      <div class="section-head__copy">
        <span class="eyebrow">Most loved by everyone else</span>
        <h2 style="font-size:var(--fs-h3)">Bestsellers you might have missed</h2>
      </div>
      <a class="link" href="shop.html?badge=BESTSELLER">All bestsellers {{ICON_ARROWRIGHT}}</a>
    </div>
    <div class="product-grid" data-wish-suggest></div>
  </div>
</section>
